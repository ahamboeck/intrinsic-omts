syntax = "proto3";

package omts.grasping;

// Gripper geometry that grasp planners plan with, set per cell in
// `gripper.model`. A planner supports one or more kinds and reads only the
// numbers of its kind, so a new gripper of a supported kind needs new numbers,
// not a new planner.
message GripperModel {
  oneof kind {
    ParallelJawGripper parallel_jaw = 1;
    SuctionGripper suction = 2;
  }
}

// Two fingers closing on opposite contacts, such as the Robotiq Hand-E.
message ParallelJawGripper {
  // Smallest gap between the finger pads, when fully closed.
  double min_width_m = 1;
  // Largest gap between the finger pads, when fully open.
  double max_width_m = 2;
  // Distance along the tool frame's +Z from the tool frame to where the finger
  // pads touch the part.
  double contact_depth_m = 3;
}

// A single suction cup that holds the part by vacuum.
message SuctionGripper {
  // Diameter of the cup's sealing lip.
  double cup_diameter_m = 1;
  // Distance along the tool frame's +Z from the tool frame to the cup's
  // sealing lip.
  double contact_depth_m = 2;
}
