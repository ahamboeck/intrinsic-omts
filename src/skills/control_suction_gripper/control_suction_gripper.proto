syntax = "proto3";

package omts.skills;

import "intrinsic/assets/proto/field_metadata.proto";
import "intrinsic/assets/proto/v1/resolved_dependency.proto";
import "intrinsic/hardware/gripper/eoat/eoat_service.proto";

// Turns the vacuum of an EOAT suction gripper on or off, like Core's
// `control_pinch_gripper` does for pinch grippers.
message SuctionGripperCommand {
  intrinsic_proto.assets.v1.ResolvedDependency suction_gripper = 1
      [(intrinsic_proto.assets.field_metadata).dependency = {
        requires: "grpc://intrinsic_proto.eoat.SuctionGripper"
        requires_object: {}
        skill_annotations: {
          always_provide_connection_info: true
          fallback_manifest_dependency_key: "suction_gripper"
        }
      }];

  oneof command {
    // Turns the vacuum on. In simulation, a part touching the cup is welded
    // to it.
    intrinsic_proto.eoat.GraspRequest grasp = 2;
    // Turns the vacuum off and lets go of the part.
    intrinsic_proto.eoat.ReleaseRequest release = 3;
  }
}
